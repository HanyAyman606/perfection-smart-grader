name: smart_grader
description: Smart Grader — exam scanning client (cv_engine two-step FFI architecture)
publish_to: 'none'
version: 2.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  web_socket_channel: ^2.4.0
  ffi: ^2.1.2
  path_provider: ^2.1.3
  image: ^4.2.0
  path: ^1.9.0
  camera: ^0.11.0+2
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/shamel.onnx

  # Native cv_engine library (libexam_scanner_ffi.so / .dll / .dylib) and
  # stage executables (stage1_boxes … stage6_scoring) are NOT bundled as
  # Flutter assets — see linux/CMakeLists.txt for how they are installed into
  # the app bundle at build time. On Android, package them as native libs
  # and set android:extractNativeLibs=true.