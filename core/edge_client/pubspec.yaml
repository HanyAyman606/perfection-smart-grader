name: nexus_edge
description: Nexus Edge — exam scanning client (cv_engine two-step FFI architecture)
publish_to: 'none'
version: 2.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  web_socket_channel: ^2.4.0
  ffi: ^2.1.2
  path_provider: ^2.1.3
  image: ^4.2.0
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/bubble.onnx

  # Native cv_engine library (libai_corrector.so / .dll / .dylib) is NOT
  # bundled as a Flutter asset — see MIGRATION_NOTES.md for how it needs
  # to be wired into android/app and ios/Runner per platform.
